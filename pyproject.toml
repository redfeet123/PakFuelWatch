[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pakfuelwatch"
version = "0.1.0"
description = "Lakehouse pipeline tracking Pakistan fuel prices and cost-of-living drivers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
    "dagster-postgres==0.29.26",
    "boto3==1.43.106",
    "s3fs==2026.9.0",
    "deltalake==1.6.6",
    "pyarrow==25.0.1",
    "pandas==2.3.3",
    "duckdb==1.5.6",
    "dbt-duckdb==1.11.0",
    "dagster-dbt==0.29.26",
    "pydantic-settings==2.8.1",
    "tenacity==9.2.1",
    "requests==2.34.2",
    "pdfplumber==0.11.10",
    "openpyxl==3.1.5",
    "patchright==1.64.1",
    "streamlit==1.65.0",
    "plotly==7.1.0",
    "python-telegram-bot==22.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "moto[s3]>=5.0.0",
    "responses>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
